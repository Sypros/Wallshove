<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14121c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
body{margin:0;font:14px system-ui,sans-serif}

[hidden]{display:none!important}
</style>
</head>
<body>
<title>Wallshove</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-screen arcade view. Thin HUD on top, roaming camera over a large maze, minimap and touch pad floating over the playfield. */
:root{
  --bg:#14121c; --panel:#1d1a28; --line:#302a42;
  --floor:#221e2e; --floor-2:#1f1b2a;
  --fixed:#443c60; --fixed-hi:#5b5282;
  --block:#c9a46a; --block-lo:#977645; --block-hi:#e6c891;
  --ember:#ffc94f; --hero:#6fd3ff; --grump:#ff5b5b; --sneak:#b97cff;
  --fg:#eee8f6; --muted:#958dae;
  --display:"Bungee", Impact, "Arial Black", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.app{height:100%;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;
  padding-block:8px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-family:var(--display);font-size:20px;letter-spacing:.02em;color:var(--block);text-shadow:2px 2px 0 var(--block-lo);line-height:1}
.hud{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0;align-items:center}
.hud div{display:flex;flex-direction:column;gap:1px}
.hud dt{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.hud dd{margin:0;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.hud dd.lit{color:var(--ember)}
.pips{display:flex;gap:4px;align-items:center;height:17px}
.pips i{width:10px;height:10px;border-radius:50%;background:var(--hero);display:block}
.pips i.gone{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.menu{font-family:var(--mono);font-size:12px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.stage{flex:1;min-height:0;position:relative;touch-action:none;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#mm{position:absolute;top:10px;right:max(10px, env(safe-area-inset-right, 0px));border-radius:6px;box-shadow:0 0 0 1px var(--line);background:var(--bg);opacity:.92;pointer-events:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb, var(--bg) 66%, transparent);padding:12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));z-index:5}
.card{width:100%;max-width:440px;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:14px}
.card h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,9vw,46px);line-height:.95;margin:0;color:var(--block);text-shadow:4px 4px 0 var(--block-lo)}
.card h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;color:var(--fg);text-wrap:balance}
.card p{margin:0;line-height:1.55;color:var(--muted);font-size:13px}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:13px;line-height:1.45}
.rules li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}
.sw{width:18px;height:18px;margin-top:1px;display:block;border-radius:3px}
.sw.block{background:repeating-linear-gradient(180deg,var(--block) 0 4px,var(--block-lo) 4px 5px);box-shadow:inset 0 2px 0 var(--block-hi)}
.sw.gate{background:var(--bg);box-shadow:inset 0 0 0 3px var(--ember);border-radius:50%}
.sw.ember{width:11px;height:11px;margin:4px 0 0 4px;background:var(--ember);transform:rotate(45deg);border-radius:2px}
.sw.hunter{background:var(--grump);border-radius:6px}
.sw.fixed{background:var(--fixed);box-shadow:inset 0 2px 0 var(--fixed-hi)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats span{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.stats b{font-size:20px;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:8px}
.go{flex:1 1 auto;font-family:var(--display);font-size:17px;letter-spacing:.04em;background:var(--block);color:#2a1f0e;border:0;border-radius:8px;padding:12px 16px;cursor:pointer;box-shadow:0 4px 0 var(--block-lo);transition:transform .08s, box-shadow .08s}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--block-lo)}
.alt{flex:1 1 auto;font-family:var(--mono);font-size:13px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.go:focus-visible,.alt:focus-visible,.menu:focus-visible,.pad button:focus-visible{outline:2px solid var(--hero);outline-offset:3px}
.keys{font-size:11px;color:var(--muted);text-align:center;line-height:1.6}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--fg)}
.banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);font-family:var(--display);font-size:clamp(24px,7vw,44px);color:var(--fg);text-shadow:3px 3px 0 var(--bg),-1px -1px 0 var(--bg);opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;white-space:nowrap;z-index:3}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.banner.bad{color:var(--grump)} .banner.good{color:var(--ember)}
.pad{position:absolute;right:max(14px, env(safe-area-inset-right, 0px));bottom:max(14px, env(safe-area-inset-bottom, 0px));display:none;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px;z-index:2;opacity:.85}
.pad button{background:color-mix(in srgb, var(--panel) 80%, transparent);border:1px solid var(--line);border-radius:12px;color:var(--fg);font-size:18px;touch-action:none;cursor:pointer}
.pad button.on{background:var(--fixed)}
.pad [data-d="up"]{grid-column:2;grid-row:1}
.pad [data-d="left"]{grid-column:1;grid-row:2}
.pad [data-d="right"]{grid-column:3;grid-row:2}
.pad [data-d="down"]{grid-column:2;grid-row:3}
@media (pointer:coarse){ .pad{display:grid} .kb{display:none} }
@media (max-width:480px){ .brand{display:none} .top{justify-content:space-between} .hud{gap:4px 12px} }
@media (prefers-reduced-motion:reduce){ .banner{transition:none} }
</style>

<div class="app">
  <header class="top">
    <div class="brand">Wallshove</div>
    <dl class="hud">
      <div><dt>Floor</dt><dd id="hLevel">1</dd></div>
      <div><dt>Embers</dt><dd id="hCoins">0/0</dd></div>
      <div><dt>Score</dt><dd id="hScore">0</dd></div>
      <div><dt>Lives</dt><dd id="hLives" class="pips"></dd></div>
      <div><dt>Best</dt><dd id="hBest">0</dd></div>
    </dl>
    <button class="menu" id="pause" type="button">Pause</button>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv" aria-label="Maze playfield"></canvas>
    <canvas id="mm" aria-hidden="true"></canvas>
    <div class="banner" id="banner" aria-live="polite"></div>
    <div class="pad" id="pad">
      <button type="button" data-d="up" aria-label="Up">▲</button>
      <button type="button" data-d="left" aria-label="Left">◀</button>
      <button type="button" data-d="right" aria-label="Right">▶</button>
      <button type="button" data-d="down" aria-label="Down">▼</button>
    </div>
    <div class="overlay" id="overlay"><div class="card" id="card"></div></div>
  </main>
</div>

<script>
(() => {
const BUILD = '2';
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
const KEYS = {arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0],
  'pad-up':[0,-1],'pad-down':[0,1],'pad-left':[-1,0],'pad-right':[1,0]};
const PLAYER_STEP = 120, SLIDE = 110, CHEW = 5, SQUASH_MS = 6000, INVULN = 2000, REVEAL = 6;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const $ = id => document.getElementById(id);
const canvas = $('cv'), ctx = canvas.getContext('2d'), stage = $('stage');
const mm = $('mm'), mctx = mm.getContext('2d');
const css = getComputedStyle(document.documentElement);
const C = {}; ['bg','floor','floor-2','fixed','fixed-hi','block','block-lo','block-hi','ember','hero','grump','sneak','fg','line','muted'].forEach(k => C[k] = css.getPropertyValue('--'+k).trim());

let W = 39, H = 29;
let grid, coins, totalCoins, quota, got, gate, start, seen, player, enemies = [], level = 1, score = 0, lives = 3, best = 0;
let state = 'title', stateUntil = 0, gt = 0, last = performance.now(), shake = 0, cell = 32, vw = 0, vh = 0, dpr = 1;
let cam = {x: 0, y: 0}, invulnUntil = 0, mmDirty = true, mmScale = 3, mmLast = 0;
const slides = new Map(); const particles = [];
let held = [], queued = null, touchDir = null, muted = false, actx = null;
try { best = +localStorage.getItem('wallshove-best') || 0; muted = localStorage.getItem('wallshove-muted') === '1'; } catch(e) {}

const rand = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const key = (x, y) => y * W + x;
const man = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
const isGate = (x, y) => gate && gate.x === x && gate.y === y;

/* ---------- maze ---------- */
function genMaze() {
  const g = [];
  for (let y = 0; y < H; y++) g.push(new Array(W).fill(1));
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (!x || !y || x === W-1 || y === H-1) g[y][x] = 2;
  const sx = 1 + 2 * rand((W - 1) / 2), sy = 1 + 2 * rand((H - 1) / 2);
  const st = [[sx, sy]]; g[sy][sx] = 0;
  while (st.length) {
    const [cx, cy] = st[st.length - 1];
    const opts = [[2,0],[-2,0],[0,2],[0,-2]].filter(([dx,dy]) => { const nx = cx+dx, ny = cy+dy; return nx > 0 && ny > 0 && nx < W-1 && ny < H-1 && g[ny][nx] === 1; });
    if (!opts.length) { st.pop(); continue; }
    const [dx, dy] = opts[rand(opts.length)];
    g[cy+dy/2][cx+dx/2] = 0; g[cy+dy][cx+dx] = 0; st.push([cx+dx, cy+dy]);
  }
  // Knock out half the dead ends so there are loops to run around.
  for (let y = 1; y < H-1; y += 2) for (let x = 1; x < W-1; x += 2) {
    const walls = DIRS.filter(([dx,dy]) => g[y+dy][x+dx] !== 0);
    if (walls.length === 3 && Math.random() < 0.5) {
      const ok = walls.filter(([dx,dy]) => g[y+dy][x+dx] === 1 && x+dx*2 > 0 && y+dy*2 > 0 && x+dx*2 < W-1 && y+dy*2 < H-1);
      if (ok.length) { const [dx,dy] = ok[rand(ok.length)]; g[y+dy][x+dx] = 0; }
    }
  }
  for (let y = 1; y < H-1; y++) for (let x = 1; x < W-1; x++) {
    if (g[y][x] !== 1) continue;
    const h = g[y][x-1] === 0 && g[y][x+1] === 0, v = g[y-1][x] === 0 && g[y+1][x] === 0;
    if ((h || v) && Math.random() < 0.1) g[y][x] = 0;
  }
  for (let y = 2; y < H-1; y += 2) for (let x = 2; x < W-1; x += 2) if (g[y][x] === 1 && Math.random() < 0.5) g[y][x] = 2;
  return g;
}

function distField(sx, sy) {
  const d = new Int16Array(W * H).fill(-1); const q = [key(sx, sy)]; d[q[0]] = 0; let h = 0;
  while (h < q.length) {
    const c = q[h++], cx = c % W, cy = (c / W) | 0;
    for (const [dx, dy] of DIRS) { const n = key(cx+dx, cy+dy); if (d[n] === -1 && grid[cy+dy][cx+dx] === 0) { d[n] = d[c] + 1; q.push(n); } }
  }
  return d;
}

function ent(x, y, dur) { return {x, y, px:x, py:y, t0:gt, dur, dir:[1,0]}; }
function moveEnt(e, x, y) { e.px = e.x; e.py = e.y; e.x = x; e.y = y; e.t0 = gt; }
function rpos(e) { const k = Math.min(1, (gt - e.t0) / e.dur); return [e.px + (e.x - e.px) * k, e.py + (e.y - e.py) * k]; }

function farCell(minFromPlayer, avoid) {
  const d = distField(player.x, player.y), opts = [];
  for (let y = 1; y < H-1; y++) for (let x = 1; x < W-1; x++) {
    const k = key(x, y);
    if (grid[y][x] === 0 && d[k] >= minFromPlayer && !isGate(x, y) && !(avoid && avoid.some(a => Math.abs(a.x-x) + Math.abs(a.y-y) < 6))) opts.push([x, y]);
  }
  if (!opts.length) for (let y = 1; y < H-1; y++) for (let x = 1; x < W-1; x++) if (grid[y][x] === 0 && Math.abs(x-player.x) + Math.abs(y-player.y) > 10) opts.push([x, y]);
  return opts.length ? opts[rand(opts.length)] : [1, 1];
}

function startLevel(n) {
  level = n;
  W = Math.min(81, 39 + (n - 1) * 8) | 1; H = Math.min(61, 29 + (n - 1) * 6) | 1;
  grid = genMaze(); slides.clear(); particles.length = 0;
  seen = new Uint8Array(W * H);
  // Start somewhere in the middle third; the gate goes to the farthest reachable cell.
  let sx, sy; do { sx = (W/3 | 0) + rand(W/3 | 0); sy = (H/3 | 0) + rand(H/3 | 0); } while (grid[sy][sx] !== 0);
  start = {x: sx, y: sy};
  player = ent(sx, sy, PLAYER_STEP * 0.9); player.next = 0; player.bump = null; player.dir = [0, 1];
  const d = distField(sx, sy); let bestK = 0;
  for (let k = 0; k < d.length; k++) if (d[k] > d[bestK]) bestK = k;
  gate = {x: bestK % W, y: (bestK / W) | 0};
  enemies = [];
  const count = Math.min(14, 3 + (n - 1) * 2);
  for (let i = 0; i < count; i++) {
    const kind = i % 3 === 2 ? 'sneak' : 'grump';
    const iv = Math.max(160, (kind === 'grump' ? 300 : 320) - (n - 1) * 15);
    const [x, y] = farCell(14, enemies);
    const e = ent(x, y, iv * 0.92);
    Object.assign(e, {kind, interval: iv, next: gt + 1200 + i * 120, dead: false, respawnAt: 0, chew: 0, chewing: null, spot: null, chase: false, alertUntil: 0});
    enemies.push(e);
  }
  quota = Math.min(50, 12 + (n - 1) * 6);
  coins = new Set();
  const cand = [];
  for (let y = 1; y < H-1; y++) for (let x = 1; x < W-1; x++) {
    if (grid[y][x] !== 0 || isGate(x, y) || Math.abs(x - sx) + Math.abs(y - sy) < 3) continue;
    if (enemies.some(e => e.x === x && e.y === y)) continue;
    cand.push(key(x, y));
  }
  shuffle(cand).slice(0, Math.min(cand.length, Math.round(quota * 1.9))).forEach(k => coins.add(k));
  totalCoins = coins.size; got = 0;
  reveal(); cam.x = sx + 0.5; cam.y = sy + 0.5; invulnUntil = gt + 1000;
  sizeMinimap(); hud();
}

function reveal() {
  const r = REVEAL;
  for (let y = Math.max(0, player.y - r); y <= Math.min(H - 1, player.y + r); y++)
    for (let x = Math.max(0, player.x - r); x <= Math.min(W - 1, player.x + r); x++)
      if ((x - player.x) ** 2 + (y - player.y) ** 2 <= r * r) seen[key(x, y)] = 1;
  mmDirty = true;
}

/* ---------- pathing ---------- */
function bfs(sx, sy, tx, ty, throughBlocks, limit) {
  if (sx === tx && sy === ty) return null;
  const prev = new Int32Array(W * H).fill(-1), dist = new Int16Array(W * H), s = key(sx, sy), t = key(tx, ty);
  const q = [s]; prev[s] = s; let head = 0;
  const dirs = shuffle(DIRS.slice());
  while (head < q.length) {
    const c = q[head++]; if (c === t) break;
    if (dist[c] >= limit) continue;
    const cx = c % W, cy = (c / W) | 0;
    for (const [dx, dy] of dirs) {
      const nx = cx + dx, ny = cy + dy, n = key(nx, ny);
      if (prev[n] !== -1) continue;
      const g = grid[ny][nx];
      if (g === 2 || (g === 1 && !throughBlocks)) continue;
      prev[n] = c; dist[n] = dist[c] + 1; q.push(n);
    }
  }
  if (prev[t] === -1) return null;
  let c = t; while (prev[c] !== s) c = prev[c];
  return {x: c % W, y: (c / W) | 0, len: dist[t]};
}

const occupied = (e, x, y) => enemies.some(o => o !== e && !o.dead && o.x === x && o.y === y);

function wander(e) {
  const open = DIRS.filter(([dx,dy]) => grid[e.y+dy][e.x+dx] === 0 && !occupied(e, e.x+dx, e.y+dy));
  if (!open.length) return;
  const fwd = open.filter(([dx,dy]) => !(dx === -e.dir[0] && dy === -e.dir[1]));
  const keep = fwd.find(([dx,dy]) => dx === e.dir[0] && dy === e.dir[1]);
  const pick = keep && Math.random() < 0.7 ? keep : (fwd.length ? fwd[rand(fwd.length)] : open[0]);
  e.dir = pick; moveEnt(e, e.x + pick[0], e.y + pick[1]);
}

function enemyStep(e) {
  const aggro = Math.min(18, 11 + level);
  const d = man(e, player);
  if (d > aggro) { if (e.chase) e.chase = false; e.chew = 0; e.chewing = null; wander(e); return 1.35; }
  let tx = player.x, ty = player.y;
  if (e.kind === 'sneak' && d > 3) {
    const ax = player.x + player.dir[0] * 4, ay = player.y + player.dir[1] * 4;
    if (ax > 0 && ay > 0 && ax < W-1 && ay < H-1 && grid[ay][ax] === 0) { tx = ax; ty = ay; }
  }
  let step = bfs(e.x, e.y, tx, ty, false, aggro * 2);
  if (!step && (tx !== player.x || ty !== player.y)) step = bfs(e.x, e.y, player.x, player.y, false, aggro * 2);
  if (!step) {
    const s2 = bfs(e.x, e.y, player.x, player.y, true, aggro + 4);
    if (!s2) { e.chase = false; wander(e); return 1.35; }
    alert(e);
    if (grid[s2.y][s2.x] === 1) {
      if (!e.chewing || e.chewing[0] !== s2.x || e.chewing[1] !== s2.y) { e.chewing = [s2.x, s2.y]; e.chew = 0; }
      e.chew++;
      if (onScreen(s2.x, s2.y)) sfx(110 + e.chew * 15, 0.05, 'sawtooth', 0.02);
      if (e.chew >= CHEW) {
        grid[s2.y][s2.x] = 0; slides.delete(key(s2.x, s2.y)); mmDirty = true;
        burst(s2.x, s2.y, C.block, 16, 5); if (onScreen(s2.x, s2.y)) sfx(90, 0.18, 'square', 0.05, -40);
        e.chew = 0; e.chewing = null;
      }
      return 1;
    }
    step = s2;
  }
  alert(e);
  e.chew = 0; e.chewing = null;
  if (occupied(e, step.x, step.y)) {
    const alt = shuffle(DIRS.slice()).map(([dx,dy]) => [e.x+dx, e.y+dy]).find(([x,y]) => grid[y][x] === 0 && !occupied(e, x, y));
    if (alt && Math.random() < 0.5) { e.dir = [alt[0]-e.x, alt[1]-e.y]; moveEnt(e, alt[0], alt[1]); }
    return 1;
  }
  e.dir = [step.x - e.x, step.y - e.y]; moveEnt(e, step.x, step.y);
  return 1;
}
function alert(e) {
  if (!e.chase) { e.chase = true; e.alertUntil = gt + 700; if (onScreen(e.x, e.y)) sfx(e.kind === 'grump' ? 520 : 660, 0.09, 'square', 0.03, 200); }
}

/* ---------- player ---------- */
function tryMove(dx, dy) {
  player.dir = [dx, dy];
  const nx = player.x + dx, ny = player.y + dy, c = grid[ny][nx];
  if (c === 2) { bump(dx, dy); return; }
  if (c === 1) {
    const bx = nx + dx, by = ny + dy;

  if ((state !== 'caught' || Math.floor(now / 90) % 2) && !blink) drawPlayer();
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
    const s = p.size * c; ctx.fillRect(p.x * c - s / 2, p.y * c - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // Torchlight: the maze darkens away from you.
  const [ppx, ppy] = rpos(player);
  const sx = ox + (ppx + 0.5) * c, sy = oy + (ppy + 0.5) * c;
  const g = ctx.createRadialGradient(sx, sy, c * 3.5, sx, sy, c * 9);
  g.addColorStop(0, 'rgba(10,8,16,0)'); g.addColorStop(1, 'rgba(10,8,16,0.72)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, vw, vh);

  // Edge arrows: hunters on your trail, and the gate once it's lit.
  for (const e of enemies) {
    if (e.dead || !e.chase) continue;
    const [ex, ey] = rpos(e); edgeArrow(ox + (ex + 0.5) * c, oy + (ey + 0.5) * c, C[e.kind], 8);
  }
  if (got >= quota) edgeArrow(ox + (gate.x + 0.5) * c, oy + (gate.y + 0.5) * c, C.ember, 12);
}

function sizeMinimap() {
  if (!W) return;
  const maxW = Math.min(170, vw * 0.36), maxH = Math.min(130, vh * 0.26);
  mmScale = Math.max(1.5, Math.min(4, Math.floor(Math.min(maxW / W, maxH / H) * 2) / 2));
  const md = window.devicePixelRatio || 1;
  mm.style.width = W * mmScale + 'px'; mm.style.height = H * mmScale + 'px';
  mm.width = Math.round(W * mmScale * md); mm.height = Math.round(H * mmScale * md);
  mctx.setTransform(md, 0, 0, md, 0, 0); mmDirty = true;
}
function drawMinimap(now) {
  if (!grid) return;
  mmDirty = false; const s = mmScale;
  mctx.fillStyle = C.bg; mctx.fillRect(0, 0, W * s, H * s);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (!seen[key(x, y)]) continue;
    const g = grid[y][x];
    mctx.fillStyle = g === 2 ? C.fixed : g === 1 ? C['block-lo'] : C.floor;
    mctx.fillRect(x * s, y * s, s, s);
  }
  mctx.fillStyle = C.ember;
  for (const k of coins) if (seen[k]) mctx.fillRect((k % W) * s + s * 0.25, ((k / W) | 0) * s + s * 0.25, s * 0.5, s * 0.5);
  if (got >= quota || seen[key(gate.x, gate.y)]) {
    mctx.fillStyle = got >= quota ? C.ember : C.muted;
    mctx.fillRect(gate.x * s - s * 0.5, gate.y * s - s * 0.5, s * 2, s * 2);
  }
  for (const e of enemies) {
    if (e.dead || man(e, player) > REVEAL + 3) continue;
    mctx.fillStyle = C[e.kind]; mctx.fillRect(e.x * s - s * 0.25, e.y * s - s * 0.25, s * 1.5, s * 1.5);
  }
  mctx.fillStyle = C.hero; mctx.fillRect(player.x * s - s * 0.5, player.y * s - s * 0.5, s * 2, s * 2);
  // View rectangle
  const [ox, oy] = camOrigin();
  mctx.strokeStyle = C.muted; mctx.lineWidth = 1;
  mctx.strokeRect((-ox / cell) * s + 0.5, (-oy / cell) * s + 0.5, (vw / cell) * s, (vh / cell) * s);
}

function resize() {
  const r = stage.getBoundingClientRect();
  vw = r.width; vh = r.height; dpr = window.devicePixelRatio || 1;
  cell = Math.round(Math.max(26, Math.min(44, Math.min(vw, vh) / 12.5)));
  canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
  sizeMinimap();
}

/* ---------- input ---------- */
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (KEYS[k]) {
    e.preventDefault();
    if (state === 'title' || state === 'over') { newGame(); }
    if (!held.includes(k)) held.push(k);
    if (!e.repeat) queued = KEYS[k];
    return;
  }
  if (k === 'p' || k === 'escape') { e.preventDefault(); if (state === 'play' || state === 'paused') togglePause(); return; }
  if ((k === 'enter' || k === ' ') && state !== 'play' && !document.activeElement?.dataset?.act) { e.preventDefault(); onAct('go'); }
});
window.addEventListener('keyup', e => { const k = e.key.toLowerCase(); held = held.filter(h => h !== k); });
window.addEventListener('blur', () => { held = []; touchDir = null; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

document.querySelectorAll('#pad button').forEach(b => {
  const k = 'pad-' + b.dataset.d;
  const up = () => { held = held.filter(h => h !== k); b.classList.remove('on'); };
  b.addEventListener('pointerdown', ev => {
    ev.preventDefault(); ev.stopPropagation(); try { b.setPointerCapture(ev.pointerId); } catch(_) {}
    if (!held.includes(k)) held.push(k); queued = KEYS[k]; b.classList.add('on');
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => b.addEventListener(t, up));
});

// Drag anywhere on the maze: the direction you drag is the direction you walk, for as long as you hold.
let drag = null;
canvas.addEventListener('pointerdown', ev => {
  if (state !== 'play') return;
  drag = {id: ev.pointerId, x: ev.clientX, y: ev.clientY}; try { canvas.setPointerCapture(ev.pointerId); } catch(_) {}
});
canvas.addEventListener('pointermove', ev => {
  if (!drag || ev.pointerId !== drag.id) return;
  let dx = ev.clientX - drag.x, dy = ev.clientY - drag.y; const d = Math.hypot(dx, dy);
  if (d < 14) return;
  const nd = Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)];
  if (!touchDir || nd[0] !== touchDir[0] || nd[1] !== touchDir[1]) { touchDir = nd; queued = nd; }
  if (d > 50) { drag.x = ev.clientX - dx / d * 50; drag.y = ev.clientY - dy / d * 50; }
});
const endDrag = ev => { if (drag && ev.pointerId === drag.id) { drag = null; touchDir = null; } };
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => canvas.addEventListener(t, endDrag));

// The Android app's back button: pause first, resume from pause, otherwise let the app close.
window.wallshoveBack = () => { if (state === 'play' || state === 'paused') { togglePause(); return true; } return false; };

$('pause').addEventListener('click', () => { if (state === 'play' || state === 'paused') togglePause(); });

new ResizeObserver(resize).observe(stage);
resize();
startLevel(1);
titleScreen();
requestAnimationFrame(loop);
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
