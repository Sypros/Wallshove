name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the web game
        run: python3 tools/build_web.py ${{ github.run_number }}

      - name: Publish to GitHub Pages (gh-pages branch)
        working-directory: site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${{ github.run_number }} from ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android app
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Publish as the 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Wallshove.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/Wallshove.apk \
            --title "Wallshove build ${{ github.run_number }}" \
            --notes "Install Wallshove.apk once. The app loads the live game, so later builds show up without reinstalling. Built from ${{ github.sha }}."
